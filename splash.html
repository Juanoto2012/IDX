<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciando IDX...</title>
    <style>
        body { margin: 0; background: #09090b; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; -webkit-app-region: drag; user-select: none; overflow: hidden;}
        .logo { width: 100px; height: 100px; animation: pulse 2s infinite ease-in-out; filter: invert(1); opacity: 0.9; }
        .title { margin-top: 24px; font-size: 24px; font-weight: bold; letter-spacing: 6px; }
        .subtitle { margin-top: 12px; font-size: 11px; opacity: 0.5; font-family: monospace; letter-spacing: 1px; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 0.7; } 50% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); opacity: 0.7; } }
        .loader { margin-top: 30px; width: 150px; height: 2px; background: #27272a; position: relative; overflow: hidden; border-radius: 2px; }
        .loader::after { content: ''; position: absolute; top: 0; left: 0; height: 100%; width: 50%; background: #3b82f6; animation: slide 1.5s infinite ease-in-out; border-radius: 2px;}
        @keyframes slide { 0% { left: -50%; } 100% { left: 100%; } }
    </style>
</head>
<body>
    <img src="assets/logo.svg" class="logo" alt="Logo">
    <div class="title">IDX EDITOR</div>
    <div class="loader"></div>
    <div class="subtitle">Cargando motor Ventarys AI y dependencias...</div>
</body>
</html>
